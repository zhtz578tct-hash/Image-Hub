<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converter v2 - Fixed Nav + Auto Save</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0f0f12;color:#eee;padding:18px;min-height:100vh}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;color:#ff3b5c;font-size:1.8em;margin:8px 0}
.sub{text-align:center;color:#777;font-size:12px;margin-bottom:12px}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.nav a{color:#ff3b5c;text-decoration:none;font-size:11px;border:1px solid #ff3b5c44;padding:6px 14px;border-radius:20px;background:#1a1a1f}
.nav a.active{background:#ff3b5c;color:#fff}
.card{background:#1a1a1f;border:1px solid #2a2a32;border-radius:14px;padding:18px;margin-bottom:14px}
.label{color:#ff3b5c;font-weight:700;font-size:11px;text-transform:uppercase;margin:10px 0 5px;display:block}
textarea{width:100%;background:#24242c;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;font-size:14px;min-height:200px;resize:vertical}
.btn{padding:12px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.btn-primary{background:#ff3b5c;color:#fff;flex:1}
.btn-ghost{background:#2a2a32;color:#fff}
.btn-green{background:#1a8a4a;color:#fff}
.flex{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.small{color:#777;font-size:11px}
.success{background:rgba(40,200,120,.1);border:1px solid rgba(40,200,120,.3);color:#5cffb0;padding:10px;border-radius:8px;margin-top:8px;font-size:13px}
.hidden{display:none !important}
.story{white-space:pre-wrap;line-height:1.8;font-size:14.5px;background:#121214;padding:14px;border-radius:10px;border:1px solid #222;max-height:500px;overflow:auto}
</style>
</head>
<body>
<div class="container">
<h1>🔤 Converter v2</h1>
<p class="sub">Fixed Navigation + Load from Story App Auto-Save</p>
<div class="nav">
<a href="index.html" style="background:#ff3b5c;color:#fff">📚 Back to Story App (Story Saved!)</a>
<a href="image.html">🎨 Image Generator</a>
</div>

<div class="card" style="background:rgba(40,200,120,.08);border:1px solid rgba(40,200,120,.2)">
<label class="label" style="color:#5cffb0">✅ Story Auto-Loaded from Story App</label>
<div class="small">Your story from Story App is auto-loaded below. You can go back anytime — story is safe, auto-saved. No more washing away!</div>
<div class="flex" style="margin-top:8px">
<button class="btn btn-green" style="padding:6px 12px;font-size:11px" onclick="loadFromStoryApp()">🔄 Reload Story from Story App</button>
<button class="btn btn-ghost" style="padding:6px 12px;font-size:11px" onclick="clearAll()">Clear</button>
</div>
</div>

<div class="card">
<label class="label">Input (Hinglish or Hindi)</label>
<textarea id="inputText" placeholder="Your story will auto-load here from Story App... or paste here"></textarea>
<div class="flex">
<select id="direction" style="width:auto;background:#24242c;border:1px solid #333;color:#fff;padding:10px;border-radius:8px">
<option value="hinglish_to_hindi">Hinglish → Hindi (Devanagari)</option>
<option value="hindi_to_hinglish">Hindi → Hinglish</option>
</select>
<button class="btn btn-primary" onclick="convert()">🔤 Convert</button>
<button class="btn btn-ghost" onclick="copyOutput()">Copy Output</button>
</div>
<div id="successBox" class="success hidden"></div>
</div>

<div class="card">
<label class="label">Output</label>
<div class="story" id="outputText">Output will appear here after conversion...</div>
<div class="flex">
<button class="btn btn-ghost" style="padding:6px 12px;font-size:11px" onclick="copyOutput()">Copy</button>
<a href="index.html"><button class="btn btn-primary" style="padding:6px 12px;font-size:11px">📚 Back to Story with Converted Text</button></a>
</div>
</div>

</div>
<script>
function init(){
  loadFromStoryApp();
  // Also load API key for conversion if needed
}
function loadFromStoryApp(){
  try{
    const chaptersStr=localStorage.getItem('story_chapters_v10_1');
    if(chaptersStr){
      const chapters=JSON.parse(chaptersStr);
      let full='';
      const order=[1,2,3,4,5].concat(Object.keys(chapters).filter(k=>k.toString().startsWith('c')).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))));
      order.forEach(k=>{ if(chapters[k]) full+=chapters[k]+'\n\n--- Chapter '+k+' ---\n\n'; });
      if(full.trim()){
        document.getElementById('inputText').value=full.trim();
        document.getElementById('outputText').textContent='✅ Loaded '+Object.values(chapters).filter(v=>v).length+' chapters from Story App. Now click Convert.';
        showSuccess('✅ Auto-loaded story with '+Object.values(chapters).filter(v=>v).length+' chapters from Story App! Safe to go back - story is auto-saved.');
        return;
      }
    }
    // Fallback to old keys
    const oldMem=localStorage.getItem('story_memory_v10') || localStorage.getItem('fullStory') || '';
    if(oldMem){
      document.getElementById('inputText').value=oldMem;
      showSuccess('Loaded from old memory');
    }
  }catch(e){ console.log(e); }
}
function clearAll(){ document.getElementById('inputText').value=''; document.getElementById('outputText').textContent='Cleared'; }

async function convert(){
  const input=document.getElementById('inputText').value.trim();
  const dir=document.getElementById('direction').value;
  if(!input) { document.getElementById('outputText').textContent='Please paste text to convert'; return; }
  document.getElementById('outputText').textContent='Converting... please wait...';
  
  // Simple client-side conversion using Venice API if key available, else basic mapping
  const apiKey=localStorage.getItem('venice_api_key');
  if(apiKey && input.length < 8000){
    try{
      const systemPrompt = dir==='hinglish_to_hindi' ? 'You are a Hinglish to Hindi Devanagari converter. Convert Roman Hinglish to pure Hindi Devanagari script. Keep meaning, emotions, names same. Only convert script, do not change story. Output ONLY converted Hindi Devanagari.' : 'You are Hindi Devanagari to Hinglish converter. Convert Hindi Devanagari to Roman Hinglish. Keep meaning same. Output ONLY Hinglish.';
      const res=await fetch('https://api.venice.ai/api/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'qwen3-235b-a22b',
          messages:[{role:'system',content:systemPrompt},{role:'user',content:input}],
          max_tokens:4000, temperature:0.2
        })
      });
      const data=await res.json();
      if(res.ok){
        const out=data.choices[0].message.content;
        document.getElementById('outputText').textContent=out;
        showSuccess('✅ Converted using Venice AI! Now copy or go back to Story App.');
        return;
      }
    }catch(e){ console.log('AI convert failed, using fallback', e); }
  }
  
  // Fallback simple notice
  document.getElementById('outputText').textContent=input + '\n\n[Note: For perfect conversion, ensure Venice API key is saved in Story App (auto-shared), then click Convert again - it will use AI conversion]';
  showSuccess('Showing original (add Venice API key in Story App for AI conversion)');
}

function copyOutput(){
  const txt=document.getElementById('outputText').textContent;
  if(!txt || txt.includes('Output will appear')) return;
  navigator.clipboard.writeText(txt);
  showSuccess('Copied output!');
}
function showSuccess(m){ const box=document.getElementById('successBox'); box.textContent=m; box.classList.remove('hidden'); setTimeout(()=>box.classList.add('hidden'),4000); }

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
