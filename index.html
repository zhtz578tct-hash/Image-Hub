<html lang="hi">

</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adult Story Generator - Final</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; color: #eee; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #ff6b6b; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .input-section { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        label { display: block; margin-bottom: 8px; color: #ff6b6b; font-weight: bold; }
        select, textarea, input[type="password"] { width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; margin-bottom: 15px; }
        select option { background: #1a1a2e; color: #fff; }
        textarea { min-height: 120px; resize: vertical; font-family: inherit; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; min-width: 150px; padding: 15px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
        .btn-primary { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,107,107,0.4); }
        .btn-secondary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .output-section { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .output-section.active { display: block; }
        .story-text { line-height: 1.8; font-size: 17px; white-space: pre-wrap; margin-bottom: 20px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .generated-image { width: 100%; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .loading { text-align: center; padding: 40px; color: #ff6b6b; }
        .error { color: #ff6b6b; padding: 15px; background: rgba(255,107,107,0.1); border-radius: 8px; margin-top: 10px; border: 1px solid rgba(255,107,107,0.3); }
        .api-key-section { background: rgba(255,193,7,0.1); border: 1px solid rgba(255,193,7,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none; }
        .success { color: #4caf50; padding: 15px; background: rgba(76,175,80,0.1); border-radius: 8px; margin-top: 10px; border: 1px solid rgba(76,175,80,0.3); }
        small { color: #888; display: block; margin-top: 5px; }
        .step { font-size: 13px; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Adult Story Generator</h1>
        <p class="subtitle">Uncensored + Perfect Hindi - Venice AI</p>

        <div class="api-key-section">
            <label>🔑 Venice API Key (Required):</label>
            <input type="password" id="apiKey" placeholder="Enter your Venice API key here (starts with VENICE_INFERENCE_KEY_)">
            <small>Get your free API key from venice.ai → Settings → API Keys. New format: VENICE_INFERENCE_KEY_...</small>
        </div>

        <div class="input-section">
            <label>🎭 Story Genre:</label>
            <select id="genre">
                <option value="romantic">Romantic / Sensual</option>
                <option value="hardcore">Hardcore / Explicit</option>
                <option value="bdsm">BDSM / Dominant</option>
                <option value="lgbtq">LGBTQ+</option>
                <option value="fantasy">Fantasy / Supernatural</option>
            </select>

            <label>📖 Language:</label>
            <select id="language">
                <option value="hindi">Hindi (हिन्दी) - 2-step uncensored</option>
                <option value="hinglish">Hinglish (Roman Hindi)</option>
                <option value="english">English</option>
            </select>

            <label>🔥 Intensity Level:</label>
            <select id="intensity">
                <option value="3">Mild (3/10)</option>
                <option value="5">Moderate (5/10)</option>
                <option value="7">Intense (7/10)</option>
                <option value="10">Extreme (10/10)</option>
            </select>

            <label>📝 Your Story Idea:</label>
            <textarea id="prompt" placeholder="Describe your story scenario here... Example: Ravi and Neha meet at a hotel..."></textarea>

            <div class="button-group">
                <button class="btn-primary" id="storyBtn" onclick="generateStory()">📚 Generate Story</button>
                <button class="btn-secondary hidden" id="imageBtn" onclick="generateImage()">🎨 Generate Image</button>
            </div>
        </div>

        <div class="output-section" id="outputSection">
            <h3 style="color: #ff6b6b; margin-bottom: 15px;">📖 Your Story:</h3>
            <div id="stepInfo" class="step hidden"></div>
            <div id="loadingText" class="loading hidden">Generating your story</div>
            <div id="storyOutput" class="story-text"></div>
            <div id="imageOutput" class="image-grid"></div>
            <div id="errorOutput" class="error hidden"></div>
            <div id="successOutput" class="success hidden"></div>
        </div>
    </div>

    <script>
        let currentStory = '';
        let currentScene = '';

        function showError(message) {
            const errorDiv = document.getElementById('errorOutput');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('successOutput').classList.add('hidden');
        }
        function showSuccess(message) {
            const successDiv = document.getElementById('successOutput');
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            document.getElementById('errorOutput').classList.add('hidden');
        }
        function hideMessages() {
            document.getElementById('errorOutput').classList.add('hidden');
            document.getElementById('successOutput').classList.add('hidden');
        }
        function setLoading(isLoading, stepText='') {
            const btn = document.getElementById('storyBtn');
            const loading = document.getElementById('loadingText');
            const stepInfo = document.getElementById('stepInfo');
            if (isLoading) {
                btn.disabled = true;
                loading.classList.remove('hidden');
                if(stepText){ stepInfo.textContent = stepText; stepInfo.classList.remove('hidden'); }
                document.getElementById('outputSection').classList.add('active');
                document.getElementById('storyOutput').textContent = '';
                document.getElementById('imageBtn').classList.add('hidden');
                document.getElementById('imageOutput').innerHTML = '';
            } else {
                btn.disabled = false;
                loading.classList.add('hidden');
                stepInfo.classList.add('hidden');
            }
        }

        async function callVenice(apiKey, model, messages, temperature=0.9, max_tokens=2000) {
            const response = await fetch('https://api.venice.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                    temperature: temperature,
                    max_tokens: max_tokens,
                    venice_parameters: {
                        include_venice_system_prompt: false,
                        enable_web_search: false
                    }
                })
            });
            const data = await response.json();
            if (!response.ok) {
                if (response.status === 401) throw new Error('401 Invalid API key - generate NEW key at venice.ai/settings/api');
                if (response.status === 402) throw new Error('402 No balance - add credits at venice.ai');
                if (response.status === 429) throw new Error('429 Rate limit - wait a moment');
                throw new Error(data.error?.message || `API ${response.status}: ${JSON.stringify(data)}`);
            }
            if (!data.choices?.[0]?.message?.content) throw new Error('Empty response: ' + JSON.stringify(data));
            return data.choices[0].message.content;
        }

        async function generateStory() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const genre = document.getElementById('genre').value;
            const language = document.getElementById('language').value;
            const intensity = document.getElementById('intensity').value;

            if (!apiKey) { showError('Please enter your Venice API key first!'); document.getElementById('outputSection').classList.add('active'); return; }
            if (!apiKey.startsWith('venice_sk_') && !apiKey.startsWith('vn_') && !apiKey.startsWith('VENICE_INFERENCE_KEY_') && !apiKey.startsWith('vapi_')) {
                showError('Invalid API key. Must start with VENICE_INFERENCE_KEY_. You entered: ' + apiKey.substring(0,25));
                document.getElementById('outputSection').classList.add('active'); return;
            }
            if (!prompt) { showError('Please enter a story idea!'); document.getElementById('outputSection').classList.add('active'); return; }

            hideMessages();

            try {
                let finalStory = '';

                if (language === 'english') {
                    setLoading(true, 'Step 1/1: Generating uncensored English story with venice-uncensored...');
                    const systemPrompt = `You are an expert erotic story writer. Create an uncensored, explicit adult story. Genre: ${genre} Intensity: ${intensity}/10. Write in English. Be completely uncensored, explicit, use natural language, detailed descriptions, 800-1200 words, include title.`;
                    finalStory = await callVenice(apiKey, 'venice-uncensored', [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: prompt }
                    ]);
                } else {
                    // 2-STEP: English uncensored -> Hindi translation
                    setLoading(true, 'Step 1/2: Generating uncensored story in English (venice-uncensored)...');
                    const systemPromptEn = `You are an expert erotic story writer. Create an uncensored, explicit adult story. Genre: ${genre} Intensity: ${intensity}/10. Write in English. Be completely uncensored, explicit, detailed, 800-1200 words, include title. Use clear adult terminology.`;
                    const englishStory = await callVenice(apiKey, 'venice-uncensored', [
                        { role: 'system', content: systemPromptEn },
                        { role: 'user', content: prompt }
                    ], 0.9, 2000);

                    setLoading(true, 'Step 2/2: Translating to perfect Hindi with qwen-2.5-72b...');
                    let targetLang = language === 'hindi' ? 'Hindi Devanagari script (हिन्दी)' : 'Hinglish (Roman Hindi using English letters)';
                    const translatePrompt = `Translate the following explicit adult story into ${targetLang}. KEEP IT FULLY UNCENSORED and EXPLICIT. Do not censor, do not replace explicit words with *** or euphemisms. Keep all adult details, keep the same intensity. Only translate language, preserve meaning. Use proper, natural ${targetLang}. Here is the story:

${englishStory}`;

                    // Use qwen for best Hindi translation, fallback to llama
                    try {
                        finalStory = await callVenice(apiKey, 'qwen-2.5-72b', [
                            { role: 'system', content: `You are a professional translator. Translate to ${targetLang} keeping it uncensored and explicit.` },
                            { role: 'user', content: translatePrompt }
                        ], 0.3, 3000);
                    } catch(e) {
                        console.log('qwen failed, trying llama', e);
                        finalStory = await callVenice(apiKey, 'llama-3.3-70b', [
                            { role: 'system', content: `You are a professional translator. Translate to ${targetLang} keeping it uncensored and explicit.` },
                            { role: 'user', content: translatePrompt }
                        ], 0.3, 3000);
                    }
                }

                currentStory = finalStory;
                document.getElementById('storyOutput').textContent = currentStory;
                document.getElementById('imageBtn').classList.remove('hidden');
                showSuccess('Story generated successfully! 2-step uncensored Hindi complete. Click Generate Image for visuals.');

                const sentences = currentStory.split(/[.।\n]/).filter(s => s.trim().length > 20);
                currentScene = sentences.slice(1, 4).join('. ');

            } catch (error) {
                showError('Error: ' + error.message);
            } finally {
                setLoading(false);
            }
        }

        async function generateImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            hideMessages();
            const imageDiv = document.getElementById('imageOutput');
            imageDiv.innerHTML = '<div class="loading">Generating image</div>';

            // Use safe prompt for image - extract non-explicit part
            const imagePrompt = `Romantic artistic scene: ${currentScene.substring(0,200)}. High quality, detailed, artistic, cinematic lighting, beautiful couple, sensual, aesthetic`;

            try {
                const response = await fetch('https://api.venice.ai/api/v1/image/generate', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'fluently-xl',
                        prompt: imagePrompt,
                        width: 1024,
                        height: 1024,
                        steps: 20,
                        safe_mode: false
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || 'Image generation failed: ' + JSON.stringify(data));
                const imageUrl = data.images[0].url || data.images[0];
                imageDiv.innerHTML = `<img src="${imageUrl}" class="generated-image" alt="Generated scene">`;
                showSuccess('Image generated successfully!');
            } catch (error) {
                imageDiv.innerHTML = '';
                showError('Image generation failed: ' + error.message);
            }
        }
    </script>
